experiment:
  name: transfer
  mode: single
  seed: 42
  device: cuda
datasets:
  selected:
  - msmarco
  train_dataset: msmarco
  train_split: train
  eval_split: dev
  max_train_examples: 100000
  train_random_pool_size: 200000
  data_root: data/raw/ir
  cache_dir: data/processed/ir/cache
  use_title: true
  allow_train_fallback: false
losses:
  selected:
  - arl
selector:
  enabled: true
  diagnostics_source: auto
  arl_post_overrides: {}
model:
  name: e5-small
  hf_name: data/pretrained/e5
  fallback_hf_name: intfloat/e5-small
  init_from: null
  query_prefix: 'query: '
  passage_prefix: 'passage: '
  pooling: mean
  normalize_embeddings: true
  max_length_query: 64
  max_length_doc: 256
negative_sampling:
  name: random
  use_bm25: false
  num_negatives: 1
  exclude_positives: true
  bm25:
    backend: rank_bm25
    top_k: 100
    sample_from_top_k: 50
    cache_path: data/processed/ir
    refresh: false
    fallback_to_random: true
  mixed:
    bm25_ratio: 0.5
    random_ratio: 0.5
training:
  epochs: 3
  protocol: source_only_checkpoint_then_target_test_once
  train_only: true
  batch_size: 16
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  fp16: true
  eval_every_epoch: false
  save_best_by: NDCG@10
  early_stopping:
    enabled: false
    patience: 0
loss_params:
  arl:
    max_prev_targets: 5000
    max_prev_decoys: 5000
    constraint_value: 0.08
    lower_band: 0.1
    min_pos_weight: 0.35
    boundary_start_epoch: 1
    threshold_momentum: 0.5
    fallback_quantile: 0.9
    exact_scan_max_items: 200000
    num_bins: 4096
    min_required_targets: 1
    margin_init: 0.03
    margin_lr: 1.0e-05
    include_inbatch_decoys: true
    decoy_mode: explicit_all
    score_mode: raw
    hard_decoy_topk: 12
    soft_rank_temperature: 0.035
    history_pair_weight: 0.05
    current_pair_weight: 1.0
    boundary_decoy_weight: 2.0
evaluation:
  full_corpus: true
  metric_backend: custom
  top_k: 100
  query_batch_size: 128
  corpus_batch_size: 512
  use_faiss: true
  chunk_size: 50000
  metrics:
  - R@1
  - R@5
  - R@10
  - NDCG@5
  - NDCG@10
  - NDCG@20
  - NDCG@1
  - R@20
  - MRR@10
  - MAP@100
outputs:
  output_root: results/ir
  update_registry: false
  save_rankings: true
  save_model: true
registry:
  primary_metric: NDCG@10
smoke:
  max_train_steps: 5
  max_eval_queries: 10
  max_corpus_docs: 200
