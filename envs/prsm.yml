# BORO PrSM feature reconstruction and rescoring.
# Versions follow docs/reproducibility.md and the validated reference environment.
name: boro-prsm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9.21
  - numpy=2.0.2
  - scipy=1.13.1
  - pandas=2.2.3
  - scikit-learn=1.5.2
  - joblib=1.4.2
  - xgboost=2.1.1
  - pip
  - pip:
      - torch==2.5.1
      - pyyaml==6.0.1
