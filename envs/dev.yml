# Development and smoke-test environment for the BORO source tree.
# This environment covers the lightweight CLI, metric, and figure checks.
name: boro-dev
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.2
  - scikit-learn=1.5.1
  - joblib=1.4.2
  - pytest=7.4.4
  - pip
  - pip:
      - torch==2.8.0
      - matplotlib==3.9.2
      - pillow==10.4.0
      - pyyaml==6.0.1
      - openpyxl==3.1.5
      - tqdm==4.66.5
