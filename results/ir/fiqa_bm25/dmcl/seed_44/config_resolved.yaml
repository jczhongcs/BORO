experiment:
  name: fiqa_bm25_dmcl_seed_44
  mode: single
  seed: 44
  device: cuda
datasets:
  selected:
  - fiqa
  train_split: train
  eval_split: test
  data_root: data/raw/ir
  cache_dir: data/processed/ir/cache
  use_title: true
  allow_train_fallback: false
  train_fallback_split: dev
losses:
  selected:
  - dmcl
selector:
  enabled: false
  diagnostics_source: auto
  arl_post_overrides: {}
model:
  name: e5-small
  hf_name: intfloat/e5-small-v2
  fallback_hf_name: intfloat/e5-small
  init_from: null
  query_prefix: 'query: '
  passage_prefix: 'passage: '
  pooling: mean
  normalize_embeddings: true
  max_length_query: 64
  max_length_doc: 256
negative_sampling:
  name: bm25
  use_bm25: false
  num_negatives: 1
  exclude_positives: true
  bm25:
    backend: rank_bm25
    top_k: 100
    sample_from_top_k: 50
    cache_path: data/processed/ir
    refresh: false
    fallback_to_random: true
  mixed:
    bm25_ratio: 0.5
    random_ratio: 0.5
training:
  epochs: 5
  protocol: fixed_epoch_test_once
  train_only: false
  batch_size: 16
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  fp16: false
  eval_every_epoch: false
  save_best_by: NDCG@10
  early_stopping:
    enabled: false
    patience: 3
loss_params:
  dmcl:
    temperature: 0.05
    detach_margin: false
evaluation:
  full_corpus: true
  metric_backend: trec_eval
  top_k: 100
  query_batch_size: 128
  corpus_batch_size: 256
  use_faiss: true
  chunk_size: 50000
  metrics:
  - R@1
  - R@5
  - R@10
  - NDCG@5
  - NDCG@10
  - NDCG@20
  - NDCG@1
  - R@20
  - MRR@10
  - MAP@100
outputs:
  save_rankings: true
  save_model: true
  output_root: results/ir/fiqa_bm25/dmcl/seed_44
  update_registry: false
_runtime:
  dataset: fiqa
  eval_dataset: fiqa
  loss: dmcl
