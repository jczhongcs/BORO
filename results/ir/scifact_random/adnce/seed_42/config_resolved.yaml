experiment:
  name: scifact_random_adnce_seed_42
  mode: single
  seed: 42
  device: cuda
datasets:
  selected:
  - scifact
  data_root: data/raw/ir
  cache_dir: data/processed/ir/cache
  use_title: true
  allow_train_fallback: false
  train_fallback_split: dev
losses:
  selected:
  - adnce
model:
  name: e5-small
  hf_name: intfloat/e5-small-v2
  fallback_hf_name: intfloat/e5-small
  init_from: null
  query_prefix: 'query: '
  passage_prefix: 'passage: '
  pooling: mean
  normalize_embeddings: true
  max_length_query: 64
  max_length_doc: 256
negative_sampling:
  name: random
  use_bm25: false
  num_negatives: 1
  exclude_positives: true
  bm25:
    backend: rank_bm25
    top_k: 100
    sample_from_top_k: 50
    cache_path: data/processed/ir
    refresh: false
    fallback_to_random: true
  mixed:
    bm25_ratio: 0.5
    random_ratio: 0.5
training:
  epochs: 5
  protocol: fixed_epoch
  batch_size: 16
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  fp16: false
  eval_every_epoch: false
  save_best_by: NDCG@10
  early_stopping:
    enabled: false
    patience: 3
loss_params:
  adnce:
    temperature: 0.07
    mu: 0.4
    sigma: 1.0
    hard_negative_weight: 0.0
evaluation:
  full_corpus: true
  metric_backend: trec_eval
  top_k: 100
  query_batch_size: 128
  corpus_batch_size: 256
  use_faiss: true
  chunk_size: 50000
  metrics:
  - R@1
  - R@5
  - R@10
  - NDCG@5
  - NDCG@10
  - NDCG@20
  - NDCG@1
  - R@20
  - MRR@10
  - MAP@100
outputs:
  save_rankings: true
  save_model: true
  output_root: results/ir/scifact_random/adnce/seed_42
  update_registry: false
_runtime:
  dataset: scifact
  eval_dataset: scifact
  loss: adnce
