experiment:
  name: msmarco_to_scidocs_triplet_seed_43
  mode: single
  seed: 43
  device: cuda
datasets:
  selected:
  - scidocs
  train_dataset: msmarco
  train_split: train
  eval_split: test
  max_train_examples: 100000
  train_random_pool_size: 200000
  data_root: data/raw/ir
  cache_dir: data/processed/ir/cache
  use_title: true
  allow_train_fallback: false
  eval_dataset: scidocs
losses:
  selected:
  - triplet
selector:
  enabled: false
  diagnostics_source: auto
  arl_post_overrides: {}
  lock_status: IMMUTABLE_BEFORE_TARGET_ACCESS
  locked_from_source_config: experiments/ir/source/triplet/seed_43.yaml
  locked_selected_arl_params:
    max_prev_targets: 5000
    max_prev_decoys: 5000
    constraint_value: 0.08
    lower_band: 0.1
    min_pos_weight: 0.35
    boundary_start_epoch: 1
    threshold_momentum: 0.5
    fallback_quantile: 0.9
    exact_scan_max_items: 200000
    num_bins: 4096
    min_required_targets: 1
    margin_init: 0.03
    margin_lr: 1.0e-05
    include_inbatch_decoys: true
    decoy_mode: explicit_all
    score_mode: raw
    hard_decoy_topk: 12
    soft_rank_temperature: 0.035
    history_pair_weight: 0.05
    current_pair_weight: 1.0
    boundary_decoy_weight: 2.0
model:
  name: e5-small
  hf_name: intfloat/e5-small-v2
  fallback_hf_name: intfloat/e5-small
  init_from: results/ir/msmarco_source/triplet/seed_43/last_model
  query_prefix: 'query: '
  passage_prefix: 'passage: '
  pooling: mean
  normalize_embeddings: true
  max_length_query: 64
  max_length_doc: 256
negative_sampling:
  name: random
  use_bm25: false
  num_negatives: 1
  exclude_positives: true
  bm25:
    backend: rank_bm25
    top_k: 100
    sample_from_top_k: 50
    cache_path: data/processed/ir
    refresh: false
    fallback_to_random: true
  mixed:
    bm25_ratio: 0.5
    random_ratio: 0.5
training:
  epochs: 0
  protocol: source_only_checkpoint_then_target_test_once
  train_only: false
  batch_size: 16
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
  fp16: true
  eval_every_epoch: false
  save_best_by: NDCG@10
  early_stopping:
    enabled: false
    patience: 0
loss_params:
  triplet:
    margin: 0.2
evaluation:
  full_corpus: true
  metric_backend: custom
  top_k: 100
  query_batch_size: 128
  corpus_batch_size: 512
  use_faiss: true
  chunk_size: 50000
  metrics:
  - R@1
  - R@5
  - R@10
  - NDCG@5
  - NDCG@10
  - NDCG@20
  - NDCG@1
  - R@20
  - MRR@10
  - MAP@100
outputs:
  save_rankings: true
  save_model: false
  output_root: results/ir/msmarco_to_scidocs/triplet/seed_43
  update_registry: false
_runtime:
  dataset: msmarco
  eval_dataset: scidocs
  loss: triplet
provenance:
  source_lock:
    variant: triplet
    seed: 43
    locked_at_utc: '2026-07-13T21:25:33.520795+00:00'
